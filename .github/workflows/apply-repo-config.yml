name: Apply repo config

# Meant to be called by app repos in their repository context.
on:
  workflow_call:

permissions:
  contents: read
  id-token: write

env:
  TERRAFORM_VERSION: 1.15

  TF_INPUT: false
  TF_CLI_ARGS: -no-color
  NO_COLOR: 1

jobs:
  apply:
    name: Apply repo config
    runs-on: ubuntu-latest

    steps:
      # Checkout the Platform repo (this one)
      - name: Checkout Platform
        uses: actions/checkout@v7.0.1
        with:
          # Explicit repository path is required
          repository: medusa-software-hq/platform
          ref: main

      # Checkout the caller app's repo
      - name: Checkout caller
        uses: actions/checkout@v7.0.1
        with:
          path: caller

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_REPO_CONFIG_WI_PROVIDER }}

      - name: Read the Terraformer GitHub App PEM key
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: |-
            pem:${{ vars.GCP_REPO_CONFIG_SECRET }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~> ${{ env.TERRAFORM_VERSION }}

      - name: Read required checks
        id: checks
        run: |
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' \
            "$GITHUB_WORKSPACE/caller/.github/required-checks.json" > /dev/null
          {
            echo "json<<TFVARS_EOF"
            jq -c . "$GITHUB_WORKSPACE/caller/.github/required-checks.json"
            echo "TFVARS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Apply Terraform configuration
        working-directory: repo-config
        env:
          TF_VAR_gh_app_terraformer_app_pem: ${{ steps.secrets.outputs.pem }}
          TF_VAR_repo_name: ${{ github.event.repository.name }}
          TF_VAR_required_checks: ${{ steps.checks.outputs.json }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ github.event.repository.name }}/repo"
          terraform apply -auto-approve
