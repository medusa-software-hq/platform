name: Check infra

on:
  workflow_call:

permissions:
  contents: read

env:
  NO_COLOR: 1

jobs:
  check-pulumi:
    name: Check Pulumi program
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: infra/.nvmrc

      # `pulumi install` rather than `npm ci`, because this program depends on an SDK
      # that does not exist until it is generated: the `packages` block in Pulumi.yaml
      # is bridged from a Terraform provider into `sdks/`, which is not committed.
      # `pulumi install` regenerates it and installs from the lockfile in one step.
      - name: Install Pulumi
        uses: pulumi/actions@v7.0.0

      - name: Install dependencies
        run: pulumi install

      - name: Run `oxfmt`
        run: npx --no-install oxfmt --check "**/*.ts"

      - name: Run `oxlint`
        # `--type-aware` is where the rules that need the type checker live.
        run: npx --no-install oxlint --type-aware

      - name: Run `tsc`
        run: npx --no-install tsc --noEmit
