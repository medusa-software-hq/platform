name: Apply infra

on:
  push:
    branches: [main]
    paths:
      - "infra/**"

  workflow_dispatch:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.15

  TF_INPUT: false
  TF_CLI_ARGS: -no-color
  NO_COLOR: 1

jobs:
  apply:
    name: Apply Terraform
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_CICD_WI_PROVIDER }}
          service_account: ${{ vars.GCP_CICD_SA_EMAIL }}

      - name: Read the Terraformer key
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: |-
            pem:ms-root-cc216992/gh-platform-terraformer-app-pem

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~> ${{ env.TERRAFORM_VERSION }}

      - name: Apply Terraform configuration
        working-directory: infra
        env:
          TF_VAR_gh_terraformer_app_pem: ${{ steps.secrets.outputs.pem }}
        run: |
          terraform init
          terraform apply -auto-approve
