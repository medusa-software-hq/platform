name: Check deploy

on:
  workflow_call:

permissions:
  contents: read

env:
  NO_COLOR: 1

jobs:
  check-deploy:
    name: Check deploy program
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: deploy/.nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Run `oxfmt`
        run: npx --no-install oxfmt --check "**/*.ts"

      - name: Run `oxlint`
        # `--type-aware` is where the rules that need the type checker live.
        run: npx --no-install oxlint --type-aware

      - name: Run `tsc`
        run: npx --no-install tsc --noEmit
