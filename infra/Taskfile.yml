# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  install:
    desc: Install dependencies
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      # `ci` installs strictly from the lockfile
      - npm ci

  checkFormatting:
    desc: Check package formatting
    deps: [install]
    cmds:
      - npx --no-install oxfmt --check "**/*.ts"

  fixFormatting:
    desc: Fix package formatting
    deps: [install]
    cmds:
      - npx --no-install oxfmt --write "**/*.ts"

  lint:
    desc: Lint the package
    deps: [install]
    cmds:
      # `--type-aware` is where the rules that need the type checker live, and they are the ones
      # that catch conditions which cannot be false.
      - npx --no-install oxlint --type-aware

  fixLint:
    desc: Fix lint issues in the package
    deps: [install]
    cmds:
      - npx --no-install oxlint --type-aware --fix

  typecheck:
    desc: Type check the package
    deps: [install]
    cmds:
      - npx --no-install tsc --noEmit

  preview:
    desc: Preview changes against the current stack
    deps: [install]
    interactive: true
    cmds:
      - pulumi preview
