# Pulumi ESC environment `platform/gcp`.
#
# Held here because it would otherwise exist only in Pulumi Cloud's web UI. Apply with:
#
#   pulumi env edit platform/gcp --file esc/gcp.yaml
#
# Pulumi Cloud mints an OIDC token, GCP exchanges it for an impersonated access token,
# and both a local `up` and a Deployments run take the same path. No key exists to
# store, rotate, or leak.
values:
  gcp:
    login:
      fn::open::gcp-login:
        project: 855478924489
        oidc:
          workloadPoolId: pulumi-cloud
          providerId: pulumi-cloud
          serviceAccount: platform@ms-central-83f4b646.iam.gserviceaccount.com
  pulumiConfig:
    gcp:accessToken: ${gcp.login.accessToken}
  environmentVariables:
    GOOGLE_OAUTH_ACCESS_TOKEN: ${gcp.login.accessToken}
